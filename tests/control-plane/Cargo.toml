[package]
name = "otwono-control-plane-tests"
description = "Integration tests: the Local Control Plane, the permission broker, and a guarded service together."
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]

[dev-dependencies]
otwono-proto = { path = "../../crates/otwono-proto" }
otwono-permd = { path = "../../crates/otwono-permd" }
otwono-hwd = { path = "../../crates/otwono-hwd" }
otwono-idd = { path = "../../crates/otwono-idd" }
otwono-netd = { path = "../../crates/otwono-netd" }
otwono-net = { path = "../../crates/otwono-net" }
otwono-identity = { path = "../../crates/otwono-identity" }
otwono-aid = { path = "../../crates/otwono-aid" }
otwono-fetch = { path = "../../crates/otwono-fetch" }
otwono-fetchd = { path = "../../crates/otwono-fetchd" }
otwono-store = { path = "../../crates/otwono-store" }
otwono-stored = { path = "../../crates/otwono-stored" }
otwono-ai = { path = "../../crates/otwono-ai", features = ["testing"] }
otwono-hal = { path = "../../crates/otwono-hal" }
otwono-capability = { path = "../../crates/otwono-capability", features = ["testing"] }
serde_json = "1"
blake3 = "1"
data-encoding = "2"
zeroize = "1"
rustix = { version = "0.38", features = ["process"] }
