[package]
name = "otwono-store"
description = "OTWONO content store contracts: chunking, content addressing, visibility labels, and the on-disk chunk store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# statvfs, for the reserve floor that stops the cache filling the disk.
rustix = { version = "0.38", features = ["fs", "process"] }
serde = { workspace = true }
serde_json = { workspace = true }
# The hash used everywhere else in this system: the audit chain, the model store, the
# fetch spool. One hash function, not four (CLAUDE.md Section 2.3).
blake3 = "1"
# Content-defined chunking at the parameters ADR-0016 measured. Seven crates, no async
# runtime, and it provides the streaming chunker a 4 GB model on a 4 GB board requires.
fastcdc = "5"
# XChaCha20-Poly1305 for encryption at rest. A 24-byte nonce means a random nonce per
# chunk is safe without tracking a counter across restarts, which a counter-based AEAD
# would require and would get wrong exactly once.
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
