[package]
name = "otwono-ai"
description = "OTWONO AI runtime contracts: model manifests, admission control, and backend selection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
otwono-capability = { workspace = true }
# For Ed25519 verification. One signature primitive in the system, not two (CLAUDE.md §2.3).
otwono-identity = { workspace = true }
otwono-hal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
data-encoding = "2"
# Content addressing for model weights. Already the hash otwono-permd chains the audit log
# with, so this is one hash function in the system rather than two (CLAUDE.md §2.3).
blake3 = "1"
# For killing a backend's whole process group without unsafe.
rustix = { version = "0.38", features = ["process"] }

[dev-dependencies]
otwono-capability = { workspace = true, features = ["testing"] }

[features]
# Exposes `signature::testing` so other crates' tests can produce genuinely signed
# manifests. Never enabled in a shipped binary.
testing = []
