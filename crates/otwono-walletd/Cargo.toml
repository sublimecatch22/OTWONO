[package]
name = "otwono-walletd"
description = "OTWONO wallet daemon: derives from a passphrase-encrypted seed and holds nothing unlocked between calls."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "otwono-walletd"
path = "src/main.rs"

[dependencies]
otwono-proto = { workspace = true }
otwono-wallet = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
otwono-permd = { workspace = true }
