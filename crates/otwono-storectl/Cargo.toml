[package]
name = "otwono-storectl"
description = "Command-line access to the OTWONO content store: put, get, export, import, label and cache."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "otwono-storectl"
path = "src/main.rs"

[dependencies]
otwono-proto = { workspace = true }
otwono-stored = { workspace = true }
otwono-envelope = { workspace = true }
otwono-identity = { workspace = true }
otwono-pointer = { workspace = true }
serde_json = { workspace = true }
data-encoding = "2"
