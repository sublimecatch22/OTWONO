[workspace]
resolver = "2"
members = [
  "packages/shared-types",
  "packages/store",
  "packages/permissions",
  "packages/provider-adapters",
  "packages/knowledge",
  "packages/agent-core",
  "apps/local-service",
  "apps/relay-api",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
authors = ["OTWONO AI"]
repository = "https://github.com/sublimecatch22/otwono"

[workspace.dependencies]
otwono-types = { path = "packages/shared-types" }
otwono-store = { path = "packages/store" }
otwono-permissions = { path = "packages/permissions" }
otwono-providers = { path = "packages/provider-adapters" }
otwono-knowledge = { path = "packages/knowledge" }
otwono-agent-core = { path = "packages/agent-core" }
otwono-local-service = { path = "apps/local-service" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal", "io-util", "process"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = "1"
directories = "5"
walkdir = "2"
quick-xml = "0.36"
zip = { version = "2", default-features = false, features = ["deflate"] }
url = "2"
regex = "1"
once_cell = "1"

# Lint policy. Everything else is `-D warnings` in CI; these are the exceptions,
# each with a reason, so that a real warning is never lost in noise.
[workspace.lints.clippy]
# Money is stored in minor units and written `12_50` for £12.50 on purpose.
inconsistent_digit_grouping = "allow"
# Builder-style test fixtures read better as `Struct { field, ..Default }`
# followed by targeted assignment.
field_reassign_with_default = "allow"
# Repository constructors mirror their table's columns; splitting them into
# parameter objects would add indirection without adding safety.
too_many_arguments = "allow"

# Password hashing is deliberately expensive. Unoptimised, it makes the test
# suite crawl without making anything safer, so these crates are compiled with
# optimisations even in a debug build.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.password-hash]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.rusqlite]
opt-level = 2
[profile.dev.package.libsqlite3-sys]
opt-level = 2

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
