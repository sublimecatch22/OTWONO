[workspace]
resolver = "2"
members = [
    "crates/otwono-hal",
    "crates/otwono-capability",
    "crates/otwono-hwctl",
    "tests/schema",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/sublimecatch22/otwono"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
otwono-hal = { path = "crates/otwono-hal" }
otwono-capability = { path = "crates/otwono-capability" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
