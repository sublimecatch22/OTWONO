[workspace]
resolver = "2"
members = [
    "crates/otwono-hal",
    "crates/otwono-capability",
    "crates/otwono-ai",
    "crates/otwono-llama",
    "crates/otwono-hwctl",
    "crates/otwono-aictl",
    "crates/otwono-identity",
    "crates/otwono-net",
    "crates/otwono-fetch",
    "crates/otwono-fetchd",
    "crates/otwono-store",
    "crates/otwono-stored",
    "crates/otwono-storectl",
    "crates/otwono-netd",
    "crates/otwono-proto",
    "crates/otwono-permd",
    "crates/otwono-permctl",
    "crates/otwono-hwd",
    "crates/otwono-idd",
    "crates/otwono-wallet",
    "crates/otwono-walletd",
    "crates/otwono-walletctl",
    "crates/otwono-aid",
    "crates/otwono-agent",
    "crates/otwono-agentctl",
    "tests/schema",
    "tests/control-plane",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Matches rust-toolchain.toml. Older compilers are untested, so we do not claim them.
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/sublimecatch22/otwono"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
otwono-hal = { path = "crates/otwono-hal" }
otwono-capability = { path = "crates/otwono-capability" }
otwono-ai = { path = "crates/otwono-ai" }
otwono-agent = { path = "crates/otwono-agent" }
otwono-llama = { path = "crates/otwono-llama" }
otwono-identity = { path = "crates/otwono-identity" }
otwono-net = { path = "crates/otwono-net" }
otwono-fetch = { path = "crates/otwono-fetch" }
otwono-fetchd = { path = "crates/otwono-fetchd" }
otwono-store = { path = "crates/otwono-store" }
otwono-stored = { path = "crates/otwono-stored" }
otwono-storectl = { path = "crates/otwono-storectl" }
otwono-proto = { path = "crates/otwono-proto" }
otwono-permd = { path = "crates/otwono-permd" }
otwono-hwd = { path = "crates/otwono-hwd" }
otwono-idd = { path = "crates/otwono-idd" }
otwono-wallet = { path = "crates/otwono-wallet" }
otwono-walletd = { path = "crates/otwono-walletd" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
