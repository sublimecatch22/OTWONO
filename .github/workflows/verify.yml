name: Verify

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Everything
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System packages for Tauri and PHP
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            php-cli php-curl

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Formatting, types and unit tests
        run: |
          npm run format:check
          npm run typecheck
          npm run test
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: WordPress plugin
        run: php wordpress/tests/run-tests.php

      - name: WordPress plugin against a live relay
        run: ./scripts/run-wordpress-live-tests.sh

      - name: Build for the end-to-end suite
        run: |
          cargo build -p otwono-local-service
          npm run build

      - name: Browser for the end-to-end suite
        run: npx playwright install --with-deps chromium

      - name: End to end
        run: npx playwright test

      - name: Keep the traces from a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
